# Type-checks, builds and tests on Windows and macOS when a pull request is merged into master,
# or when run by hand (Actions → CI → Run workflow). Plain pushes don't run it.
name: CI

on:
  pull_request:
    branches: [master]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # A closed pull request runs this only if it was merged.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Type-check and build the UI
        run: npm run build

      - name: Rust tests (settings, themes and their contrast rules)
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build the app
        working-directory: src-tauri
        run: cargo build --bins
