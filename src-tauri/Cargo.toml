[package]
name = "fileboat"
version = "0.0.0"
description = "A small, fast file explorer for developers"
license = "MIT"
repository = "https://github.com/yash-desai-naik/fileboat"
edition = "2024"
publish = false
default-run = "fileboat"

# The code with no window in it (folders, git, search, settings, Claude helpers), shared by the
# desktop app and, later, the `fb` command line.
[lib]
name = "fileboat_core"
path = "src/lib.rs"

# The desktop app.
[[bin]]
name = "fileboat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: trees show keys in the file's order.
serde_json = { version = "1", features = ["preserve_order"] }
# %APPDATA% and %LOCALAPPDATA% without needing Tauri (the core is window-free).
dirs = "7"
# Updates from GitHub releases, signature-checked against the key in tauri.conf.json.
tauri-plugin-updater = "2"
# Tauri's own async runtime; timers for the daily update check.
tokio = { version = "1", features = ["time"] }
# FILEBOAT_UPDATE_URL (a test feed) is parsed as a URL.
url = "2"
# File system events (ReadDirectoryChangesW, FSEvents): open folders update without polling.
notify = "8"
# The Recycle Bin (Windows) and the Trash (macOS).
trash = "5"
# Dragging files out of Fileboat into other apps (a system drag with the file list).
drag = "2"
# Preview: formats recognised by content, text in any encoding, archive lists, YAML and TOML trees.
infer = "0.22"
encoding_rs = "0.8"
chardetng = "1"
# Lists only (the central directory), so no compression codecs are needed.
zip = { version = "9", default-features = false }
tar = "0.4"
flate2 = "1"
toml = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"

[target.'cfg(windows)'.dependencies]
# Already built for Tauri's windowing; used for the window's "Restore Down" rectangle, to open
# files with their default app (ShellExecute), to list drives with their free space, and for the
# file clipboard shared with Explorer.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_NetworkManagement_WNet", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell_Common", "Win32_System_Com"] }

[target.'cfg(unix)'.dependencies]
# Already built for Tauri; free space on volumes (statvfs).
libc = "0.2"

[profile.release]
# "thin" LTO in parallel units: builds several times faster and needs far less RAM than full
# LTO with one unit, for a nearly identical app.
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
